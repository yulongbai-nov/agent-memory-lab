name: Contract and CouchDB sync
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Run synthetic CouchDB and PouchDB benchmark
        working-directory: benchmark/couchdb-sync
        run: ./run.sh
      - name: Preserve synthetic results on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couchdb-synthetic-results
          path: benchmark/couchdb-sync/results/
          if-no-files-found: warn
          retention-days: 14
