name: Contract and CouchDB sync
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Install pinned workflow validator
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check scoped code and workflows
        run: npm run quality
      - run: npm test
      - name: Ensure ripgrep is available for the file baseline
        run: |
          if ! command -v rg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ripgrep
          fi
      - name: Verify deterministic bounded memory retrieval (no model)
        run: npm run check:memory-retrieval
      - name: Verify packaged production CLI and MCP
        run: npm run smoke:package
      - name: Verify product sync and protected roles
        run: node tests/archive-hub.cjs
      - name: Run synthetic CouchDB and PouchDB benchmark
        working-directory: benchmark/couchdb-sync
        run: ./run.sh
      - name: Preserve synthetic results on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: couchdb-synthetic-results
          path: benchmark/couchdb-sync/results/
          if-no-files-found: warn
          retention-days: 14
