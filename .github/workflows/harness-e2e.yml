name: Synthetic harness isolation
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Isolated CLI, archive handoff, and MCP protocol replay (no model)
        run: ./benchmark/harness-e2e/run-public.sh
  trusted-model-e2e:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: public-protocol
    runs-on: ubuntu-24.04
    environment: harness-e2e-protected
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Protected bounded model and MCP acceptance
        env:
          MEMORY_LUNA_API_KEY: ${{ secrets.MEMORY_LUNA_API_KEY }}
        run: |
          if [ -z "$MEMORY_LUNA_API_KEY" ]; then
            echo 'BLOCKED: MEMORY_LUNA_API_KEY is not configured.'
            exit 1
          fi
          ./benchmark/harness-e2e/run-trusted.sh
