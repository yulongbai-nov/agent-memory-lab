# Synthetic container mounts: repository at /memory and test archive at /archive.
- insert:
    - id: mcp-synthetic-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: memory
        transport: stdio
        command: node
        args: ['/opt/dsh-test/recall.cjs', '--observe-mcp']
        failOnStartupError: true
        reconnect:
          enabled: false
